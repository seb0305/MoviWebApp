{% extends "base.html" %}
{% block content %}
<h1>Movies for User {{ user_id }}</h1>
<ul class="movie-list">
    {% for movie in movies %}
    <li class="movie-entry">
        <img src="{{ movie.poster_url }}" alt="{{ movie.name }}" style="width: 100px; height: auto;">
        {{ movie.name }} ({{ movie.year }}) - {{ movie.director }}
        <form action="{{ url_for('delete_movie', user_id=user_id, movie_id=movie.id) }}" method="post">
            <button type="submit">Delete Movie</button>
        </form>
    </li>
    {% endfor %}
</ul>
<form action="{{ url_for('add_movie', user_id=user_id) }}" method="post">
    <input type="text" name="title" placeholder="Movie Title" required>
    <button type="submit">Add Movie</button>
</form>
{% endblock %}
