{% extends "base.html" %}
{% block content %}
<h1>Movies for {{ user_name }}</h1>
<ul class="movie-list">
    {% for movie in movies %}
    <li class="movie-entry">
        <div class="movie-container">
            <img src="{{ movie.poster_url }}" alt="{{ movie.name }}" style="width: 100px; height: auto;">
            <div class="movie-info">
                <p>{{ movie.name }} ({{ movie.year }}) - {{ movie.director }}</p>
            </div>
            <form action="{{ url_for('delete_movie', user_id=user_id, movie_id=movie.id) }}" method="post" class="delete-form">
                <button type="submit" class="delete-btn"><i class="fas fa-trash"></i></button>
            </form>
        </div>
    </li>
    {% endfor %}
</ul>
<form action="{{ url_for('add_movie', user_id=user_id) }}" method="post">
    <input type="text" name="title" placeholder="Movie Title" required>
    <button type="submit">Add Movie</button>
</form>
{% endblock %}
